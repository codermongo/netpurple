<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="darkreader-lock">
    <title>404 | Page Not Found | NetPurple</title>
    <meta name="description" content="The page you're looking for doesn't exist on NetPurple.">
    <meta name="robots" content="noindex, nofollow">
    <meta name="author" content="NetPurple">
    <meta name="theme-color" content="#121224">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <meta property="og:title" content="404 | Page Not Found | NetPurple">
    <meta property="og:description" content="The page you're looking for doesn't exist on NetPurple.">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="NetPurple">
    <meta property="og:locale" content="en_US">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <style>
        .error-code {
            font-size: 6rem;
            font-weight: 700;
            line-height: 1;
            margin-bottom: 0.5rem;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            filter: drop-shadow(0 0 20px rgba(139, 92, 246, 0.3));
        }

        .error-links {
            display: flex;
            flex-wrap: wrap;
            gap: 0.6rem;
            justify-content: center;
            margin-top: 1.5rem;
        }

        .error-links a {
            font-size: 0.8rem;
            color: var(--text-secondary);
            text-decoration: none;
            padding: 6px 14px;
            border-radius: 999px;
            border: 1px solid var(--card-glass-stroke);
            background: var(--card-glass-bg);
            transition: all 0.3s ease;
        }

        .error-links a:hover {
            color: var(--text-primary);
            border-color: rgba(99, 102, 241, 0.35);
            background: var(--card-glass-hover);
            transform: translateY(-2px);
        }
    </style>
</head>
<body data-auth="out">
    <script>try{var d=localStorage;if(d.getItem('darkMode')==='true')document.body.classList.add('dark-mode');if(d.getItem('lowPowerMode')==='true'&&(d.getItem('lowPowerMobileOnly')!=='true'||matchMedia('(max-width:768px)').matches))document.body.classList.add('low-power-mode');}catch(e){}</script>

    <div class="theme-toggle-container">
        <a href="/" class="menu-item-circle visible" aria-label="Back to NetPurple">
            <i class="fa-solid fa-house" aria-hidden="true"></i>
        </a>
        <a href="https://github.com/codermongo/netpurple" class="menu-item-circle visible" aria-label="GitHub" target="_blank" rel="noopener" style="text-decoration: none;">
            <i class="fa-brands fa-github" style="font-size: 24px;"></i>
        </a>
    </div>

    <div class="user-menu auth-only" id="user-menu" role="group" aria-label="Account">
        <button class="user-logout" id="logout-btn" type="button" aria-label="Log out">X</button>
        <span class="user-handle" id="user-handle">User</span>
    </div>
    <a class="menu-item-circle user-login auth-out" id="login-link" href="/login" aria-label="Login">
        <i class="fa-solid fa-user" aria-hidden="true"></i>
    </a>

    <canvas id="bg-particles" aria-hidden="true"></canvas>

    <section class="hero" style="min-height: 70vh;">
        <div class="hero-content">
            <div class="error-code">404</div>
            <h1 class="hero-title" style="font-size: 1.6rem;">Page Not Found</h1>
            <p class="hero-description">This page doesn't exist, was moved, or never existed in the first place.</p>
            <div class="hero-buttons">
                <a href="/" class="btn-primary"><i class="fa-solid fa-house"></i> Back to Home</a>
            </div>
            <div class="error-links">
                <a href="/games"><i class="fa-solid fa-gamepad"></i> Fun Hub</a>
                <a href="/tier"><i class="fa-solid fa-list-ol"></i> Tierlist</a>
                <a href="/tools"><i class="fa-solid fa-wrench"></i> Tools</a>
                <a href="/list"><i class="fa-solid fa-magnifying-glass"></i> Free stuff</a>
            </div>
        </div>

        <div class="hero-background">
            <div class="floating-elements">
                <div class="floating-element"></div>
                <div class="floating-element"></div>
                <div class="floating-element"></div>
                <div class="floating-element"></div>
            </div>
        </div>
    </section>

    <script src="particles.js"></script>
    <script src="/config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/appwrite@14.0.1"></script>
    <script src="auth.js"></script>
</body>
</html>
