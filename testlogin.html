<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="darkreader-lock">
    <meta name="robots" content="noindex, nofollow">
    <title>NetPurple | Anmelden (Test)</title>
    <meta name="theme-color" content="#121224">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="perf.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        .login-stage {
            position: relative;
            z-index: 1;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
        }
        .login-card {
            width: min(380px, 100%);
            padding: 2.4rem 2.2rem 1.8rem;
            background: var(--card-glass-bg);
            backdrop-filter: blur(8px) saturate(120%);
            -webkit-backdrop-filter: blur(8px) saturate(120%);
            border: 1px solid var(--card-glass-stroke);
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(59, 130, 246, 0.08);
            text-align: center;
        }
        .login-logo {
            width: 44px;
            height: 44px;
            display: block;
            margin: 0 auto 0.6rem;
        }
        .login-card h1 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 0.4rem;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .login-sub {
            color: var(--text-secondary);
            font-size: 0.85rem;
            line-height: 1.5;
            margin-bottom: 1.5rem;
        }
        .login-card .field { text-align: left; }
        .login-card .field + .field { margin-top: 10px; }
        .login-card .field.err input { border-color: rgba(229, 72, 77, 0.7); }
        .login-link-row {
            text-align: left;
            margin: 10px 0 1.3rem;
        }
        .login-card a {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.82rem;
            transition: color 0.2s ease;
        }
        .login-card a:hover { color: var(--accent-purple); }
        .login-card .primary {
            width: 100%;
            font-size: 0.95rem;
        }
        .login-error {
            min-height: 18px;
            margin-top: 10px;
            color: #f0717a;
            font-size: 0.82rem;
            text-align: left;
        }
        .login-foot {
            margin-top: 0.6rem;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }
        .login-foot strong { font-weight: 500; color: var(--text-primary); }
        .login-card .login-foot a {
            font-size: 0.85rem;
            font-weight: 600;
            color: #6366F1;
        }
        .login-card .login-foot a:hover { color: #818cf8; }
        .login-card .form-divider { margin: 0.4rem 0 0.9rem; }
        .login-card .oauth-btn {
            font-size: 0.92rem;
            font-weight: 500;
            color: var(--text-primary);
            transition: all 0.3s ease;
            margin-bottom: 1rem;
        }
        .login-card .oauth-btn:hover { color: var(--text-primary); }
        .login-card #err-login { margin-bottom: 0.4rem; }
        .login-view { animation: loginFade 0.2s ease; }
        .login-view[hidden] { display: none !important; }
        @keyframes loginFade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
    </style>
</head>
<body>
    <script>try{var d=localStorage,m=function(q){return matchMedia(q).matches},p=d.getItem('lowPowerMode')==='true'||(d.getItem('lowPowerExplicit')!=='true'&&(m('(max-width:768px)')||m('(prefers-reduced-motion:reduce)')));if(d.getItem('darkMode')==='true')document.body.classList.add('dark-mode');if(p&&(d.getItem('lowPowerMobileOnly')!=='true'||m('(max-width:768px)')))document.body.classList.add('low-power-mode');}catch(e){}</script>

    <div class="theme-toggle-container">
        <a href="index.html" class="menu-item-circle visible" aria-label="Zurück zu NetPurple">
            <i class="fa-solid fa-house" aria-hidden="true"></i>
        </a>
        <a href="https://github.com/codermongo/netpurple" class="menu-item-circle visible" aria-label="GitHub" target="_blank" rel="noopener" style="text-decoration: none;">
            <i class="fa-brands fa-github" style="font-size: 24px;"></i>
        </a>
    </div>

    <canvas id="bg-particles" aria-hidden="true"></canvas>

    <main class="login-stage">
        <div class="login-card">
            <img class="login-logo" src="logo.png" alt="NetPurple">

            <!-- Anmelden: E-Mail + Passwort auf einer Seite -->
            <section class="login-view" id="view-user">
                <h1>Anmelden</h1>
                <p class="login-sub">Melde Dich mit Deinem NetPurple Konto an.</p>
                <form id="form-login" novalidate>
                    <label class="field"><input id="email" type="email" placeholder="E-Mail-Adresse" autocomplete="email" autofocus></label>
                    <label class="field"><input id="password" type="password" placeholder="Passwort" autocomplete="current-password"></label>
                    <div class="login-link-row"><a href="#">Passwort vergessen?</a></div>
                    <button class="primary" type="submit">Anmelden</button>
                    <p class="login-error" id="err-login" role="alert"></p>
                </form>

                <div class="form-divider" aria-hidden="true"><span>oder</span></div>

                <a class="btn-secondary oauth-btn" id="google-login-btn" href="#">
                    <i class="fa-brands fa-google" aria-hidden="true"></i>
                    Weiter mit Google
                </a>

                <p class="login-foot"><strong>Neu hier?</strong> <a href="#" data-go="register">Konto erstellen</a></p>
            </section>

            <!-- Registrieren -->
            <section class="login-view" id="view-register" hidden>
                <h1>Konto erstellen</h1>
                <p class="login-sub">Lege Dein neues NetPurple Konto an.</p>
                <form id="form-register" novalidate>
                    <label class="field"><input id="reg-name" type="text" placeholder="Benutzername" autocomplete="username"></label>
                    <label class="field"><input id="reg-email" type="email" placeholder="E-Mail-Adresse" autocomplete="email"></label>
                    <label class="field"><input id="reg-pass" type="password" placeholder="Passwort (min. 8 Zeichen)" autocomplete="new-password"></label>
                    <div style="height: 1.3rem"></div>
                    <button class="primary" type="submit">Registrieren</button>
                    <p class="login-error" id="err-reg" role="alert"></p>
                </form>
                <p class="login-foot"><strong>Schon ein Konto?</strong> <a href="#" data-go="user">Anmelden</a></p>
            </section>
        </div>
    </main>

    <script src="particles.js"></script>
    <script>
    // Nur Test-UI, keine echte Anmeldung
    const views = { user: 'view-user', register: 'view-register' };
    function show(v) {
        for (const k in views) document.getElementById(views[k]).hidden = k !== v;
        const first = document.querySelector('#' + views[v] + ' input');
        if (first) setTimeout(() => first.focus(), 30);
    }
    document.querySelectorAll('[data-go]').forEach(a => a.addEventListener('click', e => { e.preventDefault(); show(a.dataset.go); }));
    document.querySelectorAll('.login-link-row a').forEach(a => a.addEventListener('click', e => e.preventDefault()));

    function fail(input, errId, msg) {
        document.getElementById(errId).textContent = msg;
        if (input) { input.parentElement.classList.add('err'); input.focus(); }
    }
    document.querySelectorAll('.login-card input').forEach(i => i.addEventListener('input', () => {
        i.parentElement.classList.remove('err');
        i.closest('form').querySelector('.login-error').textContent = '';
    }));

    document.getElementById('form-login').addEventListener('submit', e => {
        e.preventDefault();
        const m = document.getElementById('email'), p = document.getElementById('password');
        if (!/^\S+@\S+\.\S+$/.test(m.value)) return fail(m, 'err-login', 'Bitte gib eine gültige E-Mail-Adresse ein.');
        if (!p.value) return fail(p, 'err-login', 'Bitte gib Dein Passwort ein.');
        fail(null, 'err-login', 'Testseite – keine echte Anmeldung.');
    });
    document.getElementById('google-login-btn').addEventListener('click', e => {
        e.preventDefault();
        fail(null, 'err-login', 'Testseite – Google-Login ist hier nicht verbunden.');
    });
    document.getElementById('form-register').addEventListener('submit', e => {
        e.preventDefault();
        const n = document.getElementById('reg-name'), m = document.getElementById('reg-email'), p = document.getElementById('reg-pass');
        if (!n.value.trim()) return fail(n, 'err-reg', 'Bitte gib einen Benutzernamen ein.');
        if (!/^\S+@\S+\.\S+$/.test(m.value)) return fail(m, 'err-reg', 'Bitte gib eine gültige E-Mail-Adresse ein.');
        if (p.value.length < 8) return fail(p, 'err-reg', 'Das Passwort muss mindestens 8 Zeichen haben.');
        fail(null, 'err-reg', 'Testseite – kein echtes Konto angelegt.');
    });
    </script>
</body>
</html>
