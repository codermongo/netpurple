    <style>
        .login-stage {
            position: relative;
            z-index: 1;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
        }
        .login-card {
            width: min(380px, 100%);
            padding: 2.4rem 2.2rem 1.8rem;
            background: var(--card-glass-bg);
            backdrop-filter: blur(8px) saturate(120%);
            -webkit-backdrop-filter: blur(8px) saturate(120%);
            border: 1px solid var(--card-glass-stroke);
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(59, 130, 246, 0.08);
            text-align: center;
        }
        .login-logo {
            width: 44px;
            height: 44px;
            display: block;
            margin: 0 auto 0.6rem;
        }
        .login-card h1 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 0.4rem;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .login-sub {
            color: var(--text-secondary);
            font-size: 0.85rem;
            line-height: 1.5;
            margin-bottom: 1.5rem;
        }
        .login-card .field { text-align: left; }
        .login-card .field + .field { margin-top: 10px; }
        .login-card .primary {
            width: 100%;
            font-size: 0.95rem;
            margin-top: 1.3rem;
        }
        .login-card .form-error {
            min-height: 18px;
            margin-top: 10px;
            color: #f0717a;
            font-size: 0.82rem;
            text-align: left;
        }
        .login-card .form-divider { margin: 0.4rem 0 0.9rem; }
        .login-card .oauth-btn {
            font-size: 0.92rem;
            font-weight: 500;
            color: var(--text-primary);
            transition: all 0.3s ease;
            margin-bottom: 1rem;
        }
        .login-card .oauth-btn:hover { color: var(--text-primary); }
        .login-card .verify-panel {
            margin: 0 0 1rem;
            text-align: left;
        }
        .login-card .verify-title { font-weight: 600; font-size: 0.9rem; }
        .login-card .verify-text { color: var(--text-secondary); font-size: 0.82rem; margin: 4px 0 10px; }
        .login-card .verify-btn {
            width: 100%;
            padding: 9px 14px;
            border-radius: 8px;
            font-family: inherit;
            font-size: 0.85rem;
            cursor: pointer;
        }
        .login-card .verify-message { font-size: 0.82rem; margin-top: 8px; }
        .login-card .verify-message[data-tone="error"] { color: #f0717a; }
        .login-card .verify-message[data-tone="success"] { color: #4ade80; }
        .login-foot {
            margin-top: 0.6rem;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }
        .login-foot strong { font-weight: 500; color: var(--text-primary); }
        .login-card .login-foot a {
            font-size: 0.85rem;
            font-weight: 600;
            color: #6366F1;
            text-decoration: none;
            transition: color 0.2s ease;
        }
        .login-card .login-foot a:hover { color: #818cf8; }
        .auth-view { animation: loginFade 0.2s ease; }
        @keyframes loginFade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
    </style>
</head>
<body data-auth="out">
    <script>try{var d=localStorage,m=function(q){return matchMedia(q).matches},p=d.getItem('lowPowerMode')==='true'||(d.getItem('lowPowerExplicit')!=='true'&&(m('(max-width:768px)')||m('(prefers-reduced-motion:reduce)')));if(d.getItem('darkMode')==='true')document.body.classList.add('dark-mode');if(p&&(d.getItem('lowPowerMobileOnly')!=='true'||m('(max-width:768px)')))document.body.classList.add('low-power-mode');}catch(e){}</script>
    <div class="theme-toggle-container">
        <a href="../index.html" class="menu-item-circle visible" aria-label="Back to NetPurple">
            <i class="fa-solid fa-house" aria-hidden="true"></i>
        </a>
        <a href="https://github.com/codermongo/netpurple" class="menu-item-circle visible" aria-label="GitHub" target="_blank" rel="noopener" style="text-decoration: none;">
            <i class="fa-brands fa-github" style="font-size: 24px;"></i>
        </a>
    </div>

    <div class="user-menu auth-only" id="user-menu" role="group" aria-label="Account">
        <button class="user-logout" id="logout-btn" type="button" aria-label="Log out">X</button>
        <span class="user-handle" id="user-handle">User</span>
    </div>
    <a class="menu-item-circle user-login auth-out" id="login-link" href="/login" aria-label="Login">
        <i class="fa-solid fa-user" aria-hidden="true"></i>
    </a>

    <canvas id="bg-particles" aria-hidden="true"></canvas>

    <main class="login-stage">
        <div class="login-card" id="login-panel">
            <img class="login-logo" src="/logo.png" alt="NetPurple">

            <section class="auth-view" id="login-view">
                <h1>Sign in</h1>
                <p class="login-sub">Sign in to your NetPurple account.</p>
                <form id="login-form" novalidate>
                    <label class="field">
                        <input type="email" name="email" id="login-email" placeholder="Email" autocomplete="email" required />
                    </label>
                    <label class="field">
                        <input type="password" name="password" id="login-password" placeholder="Password" autocomplete="current-password" required />
                    </label>
                    <button class="primary" id="login-btn" type="submit">Sign in</button>
                    <p class="form-error" id="login-error" role="alert"></p>
                </form>

                <div class="verify-panel" id="verify-panel" hidden>
                    <p class="verify-title" id="verify-title">Email verification required</p>
                    <p class="verify-text">Please verify your email before continuing.</p>
                    <button class="btn-secondary verify-btn" id="send-verification-btn" type="button">Send verification email</button>
                    <p class="verify-message" id="verification-message" role="status" aria-live="polite"></p>
                </div>

                <div class="form-divider" aria-hidden="true"><span>or</span></div>

                <a class="btn-secondary oauth-btn" id="google-login-btn" href="/login">
                    <i class="fa-brands fa-google" aria-hidden="true"></i>
                    Continue with Google
                </a>

                <p class="login-foot"><strong>New here?</strong> <a href="/login?view=register" id="show-register-link">Create account</a></p>
            </section>

            <section class="auth-view" id="register-view" hidden>
                <h1>Create account</h1>
                <p class="login-sub">Create your new NetPurple account.</p>
                <form id="register-form" novalidate>
                    <label class="field">
                        <input type="text" name="name" id="register-name" placeholder="Name" autocomplete="name" required />
                    </label>
                    <label class="field">
                        <input type="email" name="email" id="register-email" placeholder="Email" autocomplete="email" required />
                    </label>
                    <label class="field">
                        <input type="password" name="password" id="register-password" placeholder="Password (at least 8 characters)" autocomplete="new-password" minlength="8" required />
                    </label>
                    <label class="field">
                        <input type="password" name="password-confirm" id="register-password-confirm" placeholder="Repeat password" autocomplete="new-password" minlength="8" required />
                    </label>
                    <button class="primary" id="register-btn" type="submit">Register</button>
                    <p class="form-error" id="register-error" role="alert"></p>
                </form>
                <p class="login-foot"><strong>Already have an account?</strong> <a href="/login" id="show-login-link">Sign in</a></p>
            </section>
        </div>
    </main>

    <script src="../particles.js?v=aa0fd8e9"></script>
    <script src="/config.js?v=13a07dde"></script>
    <script src="https://cdn.jsdelivr.net/npm/appwrite@14.0.1"></script>
    <script src="../auth.js?v=83d31782"></script>
</body>
</html>
